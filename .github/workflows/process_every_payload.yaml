name: Process BIP PR

on:
  workflow_dispatch:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - "BIPs/**"
      - "config/**"
      - "MaxiOps/**"
      - "OmniOps/**"
      - "OmniAutoOps/**"
      - "TreasuryOps/**"
jobs:
  run_reports:
    uses: "balancer/multisig-ops/.github/workflows/run_reports_reusable.yaml@main"
    secrets: inherit
    with:
      pr_number: ${{ github.event.number || '0' }}
      checkout_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      checkout_branch: ${{ github.event.pull_request.head.ref || github.ref_name }}
